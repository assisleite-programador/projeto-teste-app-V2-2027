<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechStore - Achadinhos</title>
    
    <!-- Configurações para PWA (Instalável no telemóvel) -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#ee4d2d">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="TechStore">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3081/3081559.png">

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: #f8fafc; color: #1e293b; padding-bottom: 40px; }
        
        header { background: #ffffff; border-bottom: 1px solid #e2e8f0; position: sticky; top: 0; z-index: 50; padding: 12px 16px; }
        .nav-container { max-width: 1200px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
        .logo { display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 1.2rem; color: #ee4d2d; cursor: pointer; }
        .logo-icon { background: #ee4d2d; color: white; width: 32px; height: 32px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-weight: bold; }
        
        .search-box { flex: 1; max-width: 400px; }
        .search-box input { width: 100%; padding: 8px 16px; border-radius: 20px; border: 1px solid #cbd5e1; background: #f1f5f9; font-size: 0.9rem; outline: none; }
        .search-box input:focus { border-color: #ee4d2d; background: #ffffff; }

        main { max-width: 1200px; margin: 0 auto; padding: 16px; }
        
        .banner { background: linear-gradient(135deg, #ee4d2d, #ff7337); border-radius: 16px; padding: 24px; color: white; margin-bottom: 24px; }
        .banner h1 { font-size: 1.5rem; margin-bottom: 8px; }
        .banner p { font-size: 0.9rem; opacity: 0.9; }

        .categories-title { font-size: 0.8rem; font-weight: 700; color: #94a3b8; text-transform: uppercase; margin-bottom: 12px; }
        .categories-scroll { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 24px; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
        .categories-scroll::-webkit-scrollbar { display: none; }
        
        .cat-btn { flex: 0 0 auto; display: flex; flex-direction: column; align-items: center; background: none; border: none; cursor: pointer; }
        .cat-circle { width: 64px; height: 64px; border-radius: 50%; background: #ffffff; border: 2px solid #e2e8f0; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; margin-bottom: 6px; }
        .cat-btn.active .cat-circle { border-color: #ee4d2d; background: #fff5f3; }
        .cat-btn span { font-size: 0.75rem; font-weight: 600; color: #64748b; }
        .cat-btn.active span { color: #ee4d2d; font-weight: 700; }

        .section-header { margin-bottom: 16px; }
        .section-header h2 { font-size: 1.2rem; color: #0f172a; }
        .section-header p { font-size: 0.8rem; color: #64748b; }

        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 16px; }
        @media (min-width: 640px) { .grid { grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); } }

        .card { background: white; border: 1px solid #e2e8f0; border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; }
        .card-img { width: 100%; height: 140px; background: #f1f5f9; display: flex; align-items: center; justify-content: center; font-size: 3rem; }
        .card-body { padding: 12px; flex: 1; display: flex; flex-direction: column; }
        .card-title { font-size: 0.9rem; font-weight: 700; margin-bottom: 4px; color: #1e293b; line-height: 1.2; }
        .card-desc { font-size: 0.75rem; color: #64748b; margin-bottom: 12px; flex: 1; }
        .card-footer { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: auto; padding-top: 8px; border-top: 1px solid #f1f5f9; }
        .card-price { font-size: 1rem; font-weight: 800; color: #0f172a; }
        
        .buy-btn { background: #ee4d2d; color: white; text-decoration: none; padding: 8px 12px; border-radius: 8px; font-size: 0.8rem; font-weight: 700; display: inline-block; text-align: center; }
        .buy-btn:active { background: #d03e20; }

        .empty-state { text-align: center; padding: 40px 16px; display: none; }
    </style>
</head>
<body>

    <header>
        <div class="nav-container">
            <div class="logo" onclick="resetToHome()">
                <div class="logo-icon">🛍️</div>
                <span>TechStore</span>
            </div>
            <div class="search-box">
                <input type="text" id="search-input" placeholder="Buscar..." oninput="filterProducts()">
            </div>
        </div>
    </header>

    <main>
        <div class="banner">
            <h1>Ofertas Diretas na Shopee</h1>
            <p>Clique em comprar e vá direto para o vendedor parceiro.</p>
        </div>

        <div class="categories-title">Categorias</div>
        <div class="categories-scroll">
            <button onclick="selectCategory('eletronicos')" id="cat-eletronicos" class="cat-btn active">
                <div class="cat-circle">🎧</div>
                <span>Eletrônicos</span>
            </button>
            <button onclick="selectCategory('roupas')" id="cat-roupas" class="cat-btn">
                <div class="cat-circle">👕</div>
                <span>Roupas</span>
            </button>
            <button onclick="selectCategory('calcados')" id="cat-calcados" class="cat-btn">
                <div class="cat-circle">👟</div>
                <span>Calçados</span>
            </button>
            <button onclick="selectCategory('lar')" id="cat-lar" class="cat-btn">
                <div class="cat-circle">🏠</div>
                <span>Para o Lar</span>
            </button>
            <button onclick="selectCategory('academia')" id="cat-academia" class="cat-btn">
                <div class="cat-circle">🏋️</div>
                <span>Academia</span>
            </button>
            <button onclick="selectCategory('suplementos')" id="cat-suplementos" class="cat-btn">
                <div class="cat-circle">💊</div>
                <span>Suplementos</span>
            </button>
        </div>

        <div class="section-header">
            <h2 id="category-title">Eletrônicos</h2>
            <p id="search-info">Produtos em destaque</p>
        </div>

        <div id="products-grid" class="grid"></div>

        <div id="empty-state" class="empty-state">
            <p>Nenhum produto encontrado.</p>
        </div>
    </main>

    <script>
        // SEUS PRODUTOS E LINKS DIRETO PARA A SHOPEE
        const categoriesData = {
            eletronicos: {
                title: "Eletrônicos",
                products: [
                    { id: 101, name: "Fone Bluetooth Sem Fio", price: 189.90, desc: "Cancelamento de ruído e bateria 24h.", icon: "🎧", url: "https://shopee.com.br" },
                    { id: 102, name: "Smartwatch Esportivo", price: 299.00, desc: "Monitor cardíaco e GPS.", icon: "⌚", url: "https://shopee.com.br" },
                    { id: 103, name: "Mochila Impermeável", price: 149.50, desc: "Com compartimento para notebook.", icon: "🎒", url: "https://shopee.com.br" },
                    { id: 104, name: "Teclado Mecânico RGB", price: 239.90, desc: "Switch azul compacto 60%.", icon: "⌨️", url: "https://shopee.com.br" },
                    { id: 105, name: "Garrafa Térmica 1L", price: 79.90, desc: "Inox, mantém gelado por 24h.", icon: "🥤", url: "https://shopee.com.br" },
                    { id: 106, name: "Carregador Rápido 65W", price: 119.00, desc: "3 saídas USB para celular/notebook.", icon: "🔌", url: "https://shopee.com.br" }
                ]
            },
            roupas: {
                title: "Roupas",
                products: [
                    { id: 201, name: "Camiseta Algodão", price: 69.90, desc: "100% algodão penteado.", icon: "👕", url: "https://shopee.com.br" },
                    { id: 202, name: "Jaqueta Jeans Slim", price: 219.90, desc: "Corte clássico e caimento ótimo.", icon: "🧥", url: "https://shopee.com.br" },
                    { id: 203, name: "Calça Jeans Stretch", price: 159.90, desc: "Com elastano para conforto.", icon: "👖", url: "https://shopee.com.br" }
                ]
            },
            calcados: {
                title: "Calçados",
                products: [
                    { id: 301, name: "Tênis Running Pro", price: 259.90, desc: "Leve e ideal para corridas.", icon: "👟", url: "https://shopee.com.br" },
                    { id: 302, name: "Chinelo Nuvem", price: 59.90, desc: "Super macio e anatômico.", icon: "🩴", url: "https://shopee.com.br" }
                ]
            },
            lar: {
                title: "Para o Lar",
                products: [
                    { id: 401, name: "Cafeteira Elétrica", price: 199.90, desc: "Jarra de vidro 1.5L.", icon: "☕", url: "https://shopee.com.br" },
                    { id: 402, name: "Air Fryer 4L", price: 349.00, desc: "Painel touch sem óleo.", icon: "🍳", url: "https://shopee.com.br" }
                ]
            },
            academia: {
                title: "Academia",
                products: [
                    { id: 501, name: "Halteres 5kg (Par)", price: 129.90, desc: "Emborrachados para treino.", icon: "🏋️", url: "https://shopee.com.br" },
                    { id: 502, name: "Mini Bands (5 Pçs)", price: 49.90, desc: "Elásticos de resistência.", icon: "🎗️", url: "https://shopee.com.br" }
                ]
            },
            suplementos: {
                title: "Suplementos",
                products: [
                    { id: 601, name: "Whey Protein 900g", price: 119.90, desc: "100% concentrado.", icon: "🥛", url: "https://shopee.com.br" },
                    { id: 602, name: "Creatina 300g", price: 89.90, desc: "Monohidratada pura.", icon: "⚡", url: "https://shopee.com.br" }
                ]
            }
        };

        let currentCategory = 'eletronicos';

        window.onload = () => {
            loadCategory(currentCategory);
        };

        function selectCategory(key) {
            currentCategory = key;
            document.querySelectorAll('.cat-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(`cat-${key}`).classList.add('active');
            document.getElementById('search-input').value = '';
            loadCategory(key);
        }

        function loadCategory(key) {
            const cat = categoriesData[key];
            document.getElementById('category-title').textContent = cat.title;
            document.getElementById('search-info').textContent = `${cat.products.length} produto(s) nesta categoria`;
            render(cat.products);
        }

        function render(items) {
            const grid = document.getElementById('products-grid');
            const empty = document.getElementById('empty-state');

            if (items.length === 0) {
                grid.innerHTML = '';
                empty.style.display = 'block';
                return;
            }

            empty.style.display = 'none';
            grid.innerHTML = items.map(p => `
                <div class="card">
                    <div class="card-img">${p.icon}</div>
                    <div class="card-body">
                        <div class="card-title">${p.name}</div>
                        <div class="card-desc">${p.desc}</div>
                        <div class="card-footer">
                            <div class="card-price">R$ ${p.price.toFixed(2).replace('.', ',')}</div>
                            <a href="${p.url}" target="_blank" class="buy-btn">Comprar</a>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function filterProducts() {
            const query = document.getElementById('search-input').value.toLowerCase().trim();
            if (!query) {
                loadCategory(currentCategory);
                return;
            }
            const all = Object.values(categoriesData).flatMap(c => c.products);
            const filtered = all.filter(p => p.name.toLowerCase().includes(query) || p.desc.toLowerCase().includes(query));
            document.getElementById('category-title').textContent = "Busca";
            document.getElementById('search-info').textContent = `${filtered.length} produto(s) encontrado(s)`;
            render(filtered);
        }

        function resetToHome() {
            document.getElementById('search-input').value = '';
            selectCategory('eletronicos');
        }

        // Registo do Service Worker para permitir instalar no telemóvel
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js');
        }
    </script>
</body>
</html>
